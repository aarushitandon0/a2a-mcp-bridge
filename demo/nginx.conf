worker_processes 1;
events { worker_connections 128; }

http {
    # Plain round robin -- the nginx default when an upstream block declares
    # nothing else. Deliberately NOT using ip_hash, a `sticky` cookie
    # (nginx-plus only, not available here anyway), or a `keepalive`
    # directive on this upstream block: `keepalive` would let nginx reuse
    # one persistent connection to the same bridge instance across many
    # client requests, which defeats the very thing this demo needs to
    # observe (a different instance serving the resume than served the
    # original call). Without it, nginx's default proxy_http_version 1.0 +
    # `Connection: close` to the upstream means every request gets its own
    # fresh load-balancing decision.
    upstream bridge_pool {
        server bridge1:8000;
        server bridge2:8000;
        server bridge3:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://bridge_pool;
            proxy_set_header Host $host;
            # Deliberately no proxy_http_version/Connection override here --
            # see the upstream block comment above for why the 1.0 default
            # matters to this demo.
        }
    }
}
