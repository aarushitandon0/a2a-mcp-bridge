[project]
name = "a2a-mcp-bridge"
version = "0.1.0"
description = "Stateless bridge exposing A2A remote agents to MCP clients, native on MCP 2026-07-28."
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.48",
    "uvicorn>=0.35",
    "httpx>=0.28",
    "a2a-sdk>=0.3",
    "cryptography>=43",
    "cbor2>=5.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]
